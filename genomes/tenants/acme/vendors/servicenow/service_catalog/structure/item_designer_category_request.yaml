name: Item Designer Category Request
category: ''
description: "<p><font size=\"2\" face=\"arial,helvetica,sans-serif\"><span style=\"\
  font-size: 10pt;\">Item Designer category requests allow you to request a new category\
  \ within the catalog. Once created, you will be able to create and publish items\
  \ that allow users to request products and services.</span></font></p>\n<p><font\
  \ size=\"2\" face=\"arial,helvetica,sans-serif\"><span style=\"font-size: 10pt;\"\
  >For each item, you will be able to define:<br /></span></font></p>\n<ul><li><font\
  \ size=\"2\" face=\"arial,helvetica,sans-serif\">the questions the user must complete\
  \ to submit the request</font></li><li><font size=\"2\" face=\"arial,helvetica,sans-serif\"\
  >approvals that must be completed for the request to progress to fulfillment</font></li><li><font\
  \ size=\"2\" face=\"arial,helvetica,sans-serif\">at least 1 task that will be used\
  \ to fulfill the request</font></li></ul>\n<p><font size=\"2\" face=\"arial,helvetica,sans-serif\"\
  >By filling out this request, you or your designate will be the manager of the item\
  \ designer category. \_You can also assign editors who will also have permission\
  \ to create/update items within this category.</font></p>\n<p><font size=\"2\" face=\"\
  arial,helvetica,sans-serif\">Once this request is fulfilled and the category is\
  \ created, you will be notified via email and sent a link to begin creating your\
  \ items.</font></p>"
