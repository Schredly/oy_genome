application_name: HR Service Catalog
vendor: ServiceNow
category: Human Resources
summary: The HR Service Catalog is designed for managing employee HR requests efficiently
  through structured intake and workflow systems. It features automated routing, approvals,
  case management, and integrations with HR systems while securely handling sensitive
  data.
source_platform: Documentation
confidence: 1
genome_document:
  objects:
  - name: HR_Service
    label: HR Service
    description: Defines type of HR request
    type: Catalog Item
  - name: HR_Case
    label: HR Case
    description: Record representing an employee request or inquiry
    type: Case
  - name: HR_Task
    label: Task
    description: Work units assigned to HR agents
    type: Task
  - name: Employee
    label: Employee
    description: The requestor submitting HR cases
    type: User
  - name: HR_Agent_Group
    label: HR Agent / Group
    description: Fulfillment teams responsible for resolving cases
    type: Group
  fields:
  - name: employee_name
    label: Employee Name
    type: String
    object: HR_Case
    required: true
    description: Name of the employee submitting the case
  - name: employee_department
    label: Employee Department
    type: String
    object: HR_Case
    required: true
    description: Department of the employee
  - name: employee_manager
    label: Employee Manager
    type: String
    object: HR_Case
    required: false
    description: Manager of the employee
  - name: employee_location
    label: Employee Location
    type: String
    object: HR_Case
    required: true
    description: Location of the employee
  - name: case_status
    label: Case Status
    type: String
    object: HR_Case
    required: true
    description: Current status of the HR case
  - name: requested_service
    label: Requested Service
    type: String
    object: HR_Case
    required: true
    description: HR service being requested by the employee
  workflows:
  - name: Case_Lifecycle
    description: Lifecycle for managing HR cases
    trigger: HR request submission
    steps:
    - Create HR Case
    - Route to HR team
    - Optional Approval
    - Process by HR agent
    - Task creation
    - Update and Resolve
    - Notify Employee
    - Close Case
  - name: Approval_Workflow
    description: Approval process for specific HR actions
    trigger: Specific HR action requests
    steps:
    - Manager or HR approval
    - Delegation if needed
    - Escalation if necessary
  relationships:
  - from_object: Employee
    to_object: HR_Case
    type: One-to-Many
    description: An employee can have multiple HR cases
  - from_object: HR_Case
    to_object: HR_Task
    type: One-to-Many
    description: A case can have multiple tasks
  - from_object: HR_Task
    to_object: HR_Agent_Group
    type: Assignment
    description: Tasks are assigned to HR agents or groups
  - from_object: HR_Case
    to_object: Employee
    type: Linked
    description: Cases are linked to the employee profile and organizational data
validation_notes: []
