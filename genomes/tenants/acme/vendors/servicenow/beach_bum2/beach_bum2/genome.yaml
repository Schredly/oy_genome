application:
  name: Beach Bum2
  scope: x_beach_bum2
  description: "Description inferred from context: Beach Bum2 application module."

entities:
  - name: Beach Item
    type: custom
    table: x_beach_bum2_item
    fields:
      - name: name
        type: string
        required: true
      - name: category
        type: choice
        required: false
        choices: ["Category 1", "Category 2"] # inferred from sys_choice
      - name: price
        type: decimal
        required: true
    relationships:
      - target_table: x_beach_bum2_category
        type: belongs_to
        via_field: category

catalog:
  items:
    - name: Rent Beach Equipment
      description: "Rent various beach equipment for your vacation."
      variables:
        - name: equipment_type
          label: "Equipment Type"
          type: select
          required: true
          order: 1
          choices: ["Surfboard", "Kayak", "Umbrella"] # inferred from question_choice
        - name: rental_days
          label: "Number of Days"
          type: numeric
          required: true
          order: 2
          choices: []

workflows:
  - name: Equipment Rental Process
    trigger: Submit Equipment Rental Form
    conditions:
      - condition: "equipment_type is not empty"
    actions:
      - action: "Check availability"
      - action: "Reserve equipment"
      - action: "Send confirmation email"

business_logic:
  rules:
    - name: Calculate Discount
      table: x_beach_bum2_item
      trigger: before insert
      logic_summary: "Apply a 10% discount for rentals over 3 days."
      external_dependencies: []

ui:
  modules:
    - name: Beach Items List
      table: x_beach_bum2_item
      type: list
      filter: "category=beach"
    - name: Item Form
      table: x_beach_bum2_item
      type: form
      filter: ""

navigation:
  menu:
    - name: Beach Bum2 Menu
      modules: ["Beach Items List", "Item Form"]

data_model:
  tables:
    - name: x_beach_bum2_item
      purpose: "Store information about available beach items."
      key_fields:
        - name: sys_id
          type: string
          notes: "inferred"
        - name: created_on
          type: datetime
          notes: "inferred"
        - name: created_by
          type: string
          notes: "inferred"
        - name: updated_on
          type: datetime
          notes: "inferred"
        - name: updated_by
          type: string
          notes: "inferred"
        - name: name
          type: string
          notes: "inferred from UI"
        - name: category
          type: string
          notes: "inferred from relationships"

integrations:
  - name: Payment Processing API
    type: REST
    direction: outbound
    description: "Process payments for equipment rentals."

logic_patterns:
  - name: decrement_inventory_on_checkout
    description: Decrease the inventory count when an item is checked out.
    trigger: checkout_created
    action: reduce inventory count
    reusable_pattern: inventory_decrement
  - name: restore_inventory_on_return
    description: Restore the inventory count when an item is returned.
    trigger: checkout_returned
    action: increase inventory count
    reusable_pattern: inventory_increment

processes:
  - name: Inventory Checkout
    steps:
      - step: Initiate checkout
        actor: Customer
        action: Fill out rental form
        system_behavior: Form submission triggers availability check
      - step: Confirm availability
        actor: System
        action: Check item availability
        system_behavior: Reserves the item if available
      - step: Payment processing
        actor: Customer
        action: Provide payment details
        system_behavior: Process payment
      - step: Inventory update
        actor: System
        action: Decrement inventory
        system_behavior: Reduce item count in database

  - name: Equipment Return
    steps:
      - step: Initiate return
        actor: Customer
        action: Return item
        system_behavior: Triggers return process
      - step: Confirm return
        actor: System
        action: Check item return
        system_behavior: Verify item status
      - step: Inventory update
        actor: System
        action: Increment inventory
        system_behavior: Increase item count in database
      - step: Close transaction
        actor: System
        action: Finalize return
        system_behavior: End transaction and send confirmation

events:
  - name: Checkout Created
    trigger: On Checkout Form Submission
    downstream_effects: Initiates Inventory Checkout Process

  - name: Item Returned
    trigger: On Item Return
    downstream_effects: Starts Equipment Return Process