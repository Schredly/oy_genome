  - name: Server Reboot
    description: "<p style=\"margin: 0px;\"><font size=\"4\" face=\"arial,helvetica,sans-serif\"\
      >Service Overview:</font></p>\n<p style=\"margin: 0px;\">\_</p>\n<p style=\"\
      margin: 0px;\"><font size=\"3\" face=\"arial,helvetica,sans-serif\">Please use\
      \ the form below to request a server reboot. Please be aware that reboots of\
      \ production servers may require additional documentation.</font></p>"
  - name: Database Restore
    description: '<p style="margin: 0px;"><font size="3" face="arial,helvetica,sans-serif">Please
      fill in the information below to request a restore of a database. Please be
      aware that restores of a production instance will require additional approvals.</font></p>'
  - name: Request Knowledge Base
    description: <p>Here you can request a new Knowledge Base to be used. A Knowledge
      Base can be used to store Knowledge in an organization and anyone can request
      for a new one to be created.</p>
  - name: Application Server (Standard)
    description: '<p><font size="3"><span>Corporate application server</span></font></p>

      <p><span style="font-size: 10.0pt;">Standard Default configuration includes:</span></p>

      <ul><li><span style="font-size: 10.0pt;">4GB RAM </span></li><li><span style="font-size:
      10.0pt;">2 X 70G SCSI drives (Raid 0) </span></li><li><span style="font-size:
      10.0pt;">Up to 250G of SAN storage (specify) </span></li><li><span style="font-size:
      10.0pt;">Linux or Windows XP (specify) </span></li></ul>

      <p><span style="font-size: 10.0pt;">Recommended Use: Application or Web server
      </span></p>'
  - name: Application Server (Large)
    description: '<p style="margin: 13.5pt 0in 6.75pt 0in;"><font size="3"><span>Corporate
      application server (Large)</span></font></p>

      <p><span style="font-size: 10.0pt;">Default configuration includes:</span></p>

      <ul><li><span style="font-size: 10.0pt;">16GB RAM</span></li><li><span style="font-size:
      10.0pt;">2 X 70G SCSI drives (Raid 0)</span></li><li><span style="font-size:
      10.0pt;">Up to 500G of SAN storage (specify)</span></li><li><span style="font-size:
      10.0pt;">Linux or Windows XP (specify)</span></li></ul>

      <p><span style="font-size: 10.0pt;">Recommended Use: Application server for
      applications with high transaction volume.</span></p>'
  - name: Database Server & Oracle License
    description: '<ul><li>

      <p><font size="3"><span>Corporate database server (Standard)</span></font></p>

      <ul><li><span style="font-size: 10.0pt;">Default configuration includes:</span></li><li><span
      style="font-size: 10.0pt;">64GB RAM</span></li><li><span style="font-size: 10.0pt;">2
      X 70G SCSI drives (Raid 0)</span></li><li><span style="font-size: 10.0pt;">Up
      to 1 TB of SAN Storage (specify in request)</span></li><li><span style="font-size:
      10.0pt;">Linux or Windows XP (specify)</span></li><li><span style="font-size:
      10.0pt;">Oracle 10g R2</span></li></ul>

      <font size="4" face="arial,helvetica,sans-serif"><span style="font-size: 8.5pt;"><br
      /><br /></span></font></li></ul>'
  - name: Email Account (old)
    description: "<p><font size=\"3\" face=\"arial,helvetica,sans-serif\">Services\
      \ Overview:</font></p>\n<p><font size=\"2\" face=\"arial,helvetica,sans-serif\"\
      >Corporate email supports both the outlook client as well as outlook web access\
      \ (OWA). \_This comes pre-installed on all users\_corporate\_issued devices.</font></p>\n\
      <p><font size=\"3\" face=\"arial,helvetica,sans-serif\">Services Overview:</font></p>\n\
      <ul><li><font size=\"2\" face=\"arial,helvetica,sans-serif\">24/7 Monitoring</font></li><li><font\
      \ size=\"2\" face=\"arial,helvetica,sans-serif\">End user support</font></li></ul>"
  - name: VM Provisioning
    description: '<p><font size="2">This service provides support and administration
      of a VMware virtual server running a supported Linux server operating system.
      Configuration changes will be handled as requested.</font></p>

      <p><font size="3">Services Include:</font></p>

      <ul><li><font size="2">Linux Environment</font></li><li><font size="2">Standard
      50 GB of Storage, 4 GB of RAM</font></li><li><font size="2">Additional CPUs,
      Storage, and RAM available upon request</font></li><li><font size="2">Alerting
      and Monitoring</font></li></ul>'
