<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Rentals Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Beach Rentals Dashboard</h1>
    </header>
    <main>
        <section id="rental-list">
            <h2>Available Rentals</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Duration</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dynamic content will be loaded here -->
                </tbody>
            </table>
        </section>
        <section id="rental-form">
            <h2>Rent a Kayak</h2>
            <form id="rental-request-form">
                <label for="customer_name">Customer Name</label>
                <input type="text" id="customer_name" name="customer_name" required>
                
                <label for="rental_duration">Rental Duration</label>
                <input type="number" id="rental_duration" name="rental_duration" required>
                
                <label for="rental_type">Rental Type</label>
                <select id="rental_type" name="rental_type" required>
                    <option value="Kayak">Kayak</option>
                    <option value="Jet Ski">Jet Ski</option>
                    <option value="Surfboard">Surfboard</option>
                </select>
                
                <button type="submit">Submit Rental Request</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2023 Beach Bum Rentals</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
