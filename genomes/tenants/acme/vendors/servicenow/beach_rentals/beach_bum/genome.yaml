application:
  name: Beach Bum
  scope: sn_beach_bum
  description: Beach Rentals software to manage beach rentals efficiently.

entities:
  - name: Rentals
    type: table
    table: x_beach_bum_rentals
    fields: [customer_id, rental_date, return_date, item, price, status]
    relationships: [customers, items]

  - name: Customers
    type: table
    table: x_beach_bum_customers
    fields: [name, contact_information, membership_status]
    relationships: [rentals]

  - name: Items
    type: table
    table: x_beach_bum_items
    fields: [item_name, item_code, category, availability]
    relationships: [rentals]

catalog:
  items:
    - name: Beach Rental Service
      variables:
        - name: Item Type
          type: choice
          required: true
          order: 1
        - name: Rental Duration
          type: integer
          required: true
          order: 2

workflows:
  - name: Process Beach Rental
    trigger: New rental request submitted
    conditions: Rental available and customer verified
    actions:
      - Check item availability
      - Calculate rental cost
      - Notify customer

business_logic:
  rules:
    - name: Rental Status Update
      table: Rentals
      trigger: after update
      logic_summary: Sets rental status based on return date
      external_dependencies: none

    - name: Customer Verification
      table: Customers
      trigger: before insert
      logic_summary: Automatically verifies customer based on customer history
      external_dependencies: Customer database

ui:
  modules:
    - name: Rental Management
      table: Rentals
      type: module
      filter: status=new OR status=in_progress

    - name: Customer Management
      table: Customers
      type: module
      filter: membership_status=active

navigation:
  menu:
    - name: Beach Bum Application
      modules: [Rental Management, Customer Management]

data_model:
  tables:
    - name: Rentals
      purpose: Manage rental transactions
      key_fields: [rental_id]

    - name: Customers
      purpose: Store customer information
      key_fields: [customer_id]

    - name: Items
      purpose: Inventory of rental items
      key_fields: [item_id]

integrations:
  - name: Payment Gateway
    type: external
    direction: outbound
    description: Process payments for rental transactions

  - name: Customer Database Sync
    type: external
    direction: bidirectional
    description: Syncs customer data with central customer database

logic_patterns:
  - name: reduce_inventory_on_checkout
    description: Decrease available item count by one upon checkout creation
    trigger: checkout_created
    action: decrement_inventory
    reusable_pattern: inventory_management

  - name: restore_inventory_on_return
    description: Increase available item count by one upon checkout return
    trigger: checkout_returned
    action: increment_inventory
    reusable_pattern: inventory_management

processes:
  - name: Beach Equipment Rental Process
    steps:
      - step: Verify customer eligibility
        actor: System
        action: Verify membership status based on historical data
        system_behavior: Fetch data from customer database and validate

      - step: Calculate rental price
        actor: System
        action: Determine cost based on item type and rental duration
        system_behavior: Calculate total price and apply any discounts

      - step: Confirm rental
        actor: Customer
        action: Accepts the rental terms and submits payment
        system_behavior: Trigger payment processing through Gateway

      - step: Update inventory
        actor: System
        action: Adjust item availability upon checkout
        system_behavior: Execute inventory decrement logic

events:
  - name: inventory_adjustment
    trigger: Rental initiation or completion
    downstream_effects:
      - Reflect changes in item availability
      - Trigger notifications if inventory falls below threshold

  - name: rental_status_change
    trigger: Return of rented item
    downstream_effects:
      - Update rental record
      - Notify customer of successful return
      - Execute inventory restoration logic