workflows:
  - name: CSA Subscription Renewal
    trigger: onRecordUpdate
    conditions: statusCHANGESTOpaused
    actions: Sends reminder email to customer when subscription is paused.
  - name: Low Feed Reorder
    trigger: onRecordUpdate
    conditions: on_hand_bagsLESS THANreorder_threshold
    actions: Sends reorder alert and creates incident for low feed.

business_logic:
  rules:
    - name: Cluck - Calculate bird age from hatch date
      table: x_1939459_cluck_bird
      trigger: before update
      logic_summary: Calculates bird age from hatch date; auto-promotes young birds when they reach maturity.
      external_dependencies: calculateBirdAge
    - name: Cluck - Adjust flock head count when bird status changes
      table: x_1939459_cluck_bird
      trigger: after update
      logic_summary: Decreases flock count when a bird's status is changed to non-active.
      external_dependencies: adjustFlockHeadCount
    - name: Cluck - Compute egg production rate
      table: x_1939459_cluck_egg_log
      trigger: before update
      logic_summary: Computes production rate as collected eggs per flock count, and updates bird's lifetime egg count.
      external_dependencies: onEggLogSave
    - name: Cluck - Auto-open feed reorder task
      table: x_1939459_cluck_feed
      trigger: after update
      logic_summary: Automates opening a reorder task when feed inventory falls below the threshold.
      external_dependencies: checkFeedReorder
    - name: Cluck - Calculate order total
      table: x_1939459_cluck_order
      trigger: before update
      logic_summary: Calculates order total based on order type, items, delivery fee, and discounts.
      external_dependencies: calculateOrderTotal
    - name: Cluck - Award loyalty eggs on fulfillment
      table: x_1939459_cluck_order
      trigger: after update
      logic_summary: Awards loyalty points and updates customer order history when an order is fulfilled.
      external_dependencies: onOrderFulfilled
    - name: Cluck - Escalate critical incidents
      table: x_1939459_cluck_incident
      trigger: before update
      logic_summary: Elevates incident priority and urgency when marked as critical.
      external_dependencies: escalateCriticalIncident

