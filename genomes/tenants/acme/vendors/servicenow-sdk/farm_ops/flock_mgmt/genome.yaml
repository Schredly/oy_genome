data_model:
  tables:
    - name: x_1939459_cluck_bird
      purpose: Track individual birds for the Adopt-a-Hen program, breeders, and with special history.
      key_fields:
        - name: tag_id
          type: string
          notes: Unique tag for bird identification.
    - name: x_1939459_cluck_breed
      purpose: Reference for chicken breeds used in operations.
      key_fields:
        - name: name
          type: string
          notes: Breed name for selection and categorization.
    - name: x_1939459_cluck_coop
      purpose: Physical structures for containing flocks.
      key_fields:
        - name: name
          type: string
          notes: Name of the coop for identification.
    - name: x_1939459_cluck_customer
      purpose: Track customer details, purchases, and sponsorships.
      key_fields:
        - name: email
          type: string
          notes: Unique email for customer contact.
    - name: x_1939459_cluck_egg_log
      purpose: Log egg production daily for statistical purposes.
      key_fields:
        - name: log_date
          type: date
          notes: Date of collection log.
    - name: x_1939459_cluck_feed
      purpose: Manage feed inventory and supplier information.
      key_fields:
        - name: name
          type: string
          notes: Name of the feed for cataloging.
    - name: x_1939459_cluck_flock
      purpose: Grouping of birds for collective management.
      key_fields:
        - name: name
          type: string
          notes: Name assigned to a flock.
    - name: x_1939459_cluck_health_record
      purpose: Track health records and interventions for birds and flocks.
      key_fields:
        - name: number
          type: auto_number
          notes: Unique health record ID generated for tracking.
    - name: x_1939459_cluck_incident
      purpose: Log incidents impacting farm operations.
      key_fields:
        - name: number
          type: auto_number
          notes: Unique incident ID generated for tracking.
    - name: x_1939459_cluck_incubation
      purpose: Manage egg incubation batches and progress tracking.
      key_fields:
        - name: batch_name
          type: string
          notes: Identifies the incubation batch.
    - name: x_1939459_cluck_order
      purpose: Capture customer orders for products and services.
      key_fields:
        - name: number
          type: auto_number
          notes: Unique order ID generated for tracking.
    - name: x_1939459_cluck_subscription
      purpose: Track egg CSA subscriptions for recurring delivery.
      key_fields:
        - name: customer
          type: reference
          notes: Links subscription to a customer.

integrations:
  - name: Cluck Egg Availability API
    type: rest_api
    direction: outbound
    description: Provides egg stock data for dashboards or external displays.