application:
  name: Cluckworks
  scope: x_1939459_cluck
  scope_id: c4500a9e73e7b8cd5f3758b2c33527fe
  version: 1.0.0
  description: 'Cluckworks - Farm-ops app for pastured-poultry operations: flock management, egg production, feed inventory, CSA subscriptions, adopt-a-hen program'

entities:
  - name: Bird
    type: primary
    table: x_1939459_cluck_bird
    fields:
      - name: tag_id
        type: string
        required: true
      - name: name
        type: string
      - name: breed
        type: reference
        required: true
      - name: flock
        type: reference
      - name: sex
        type: choice
        required: true
        choices: ["hen", "rooster", "pullet", "cockerel", "unknown"]
      - name: hatched_date
        type: date
      - name: age_days
        type: integer
      - name: weight_grams
        type: integer
      - name: color_pattern
        type: string
      - name: is_breeding_stock
        type: boolean
      - name: is_adoptable
        type: boolean
      - name: adoption_sponsor
        type: reference
      - name: adoption_expires
        type: date
      - name: egg_color_observed
        type: string
      - name: lifetime_eggs
        type: integer
      - name: status
        type: choice
        required: true
        choices: ["active", "molting", "brooding", "injured", "retired", "deceased", "processed", "escaped"]
      - name: personality_score
        type: decimal
    relationships:
      - target_table: x_1939459_cluck_breed
        type: belongs_to
        via_field: breed
      - target_table: x_1939459_cluck_flock
        type: belongs_to
        via_field: flock
      - target_table: x_1939459_cluck_customer
        type: belongs_to
        via_field: adoption_sponsor
    seed_data: true
  - name: Breed
    type: lookup
    table: x_1939459_cluck_breed
    fields:
      - name: name
        type: string
        required: true
      - name: purpose
        type: choice
        required: true
        choices: ["layer", "meat", "dual", "ornamental"]
      - name: avg_eggs_per_year
        type: integer
      - name: egg_color
        type: choice
        choices: ["white", "brown", "blue", "green", "cream", "speckled", "chocolate"]
      - name: temperament
        type: choice
        choices: ["docile", "active", "broody", "aggressive"]
      - name: avg_weight_kg
        type: integer
      - name: cold_hardy
        type: boolean
      - name: heat_tolerant
        type: boolean
      - name: heritage
        type: boolean
    seed_data: true
  - name: Coop
    type: primary
    table: x_1939459_cluck_coop
    fields:
      - name: name
        type: string
        required: true
      - name: capacity
        type: integer
        required: true
      - name: square_meters
        type: integer
      - name: style
        type: choice
        choices: ["fixed", "mobile", "pasture", "hoop"]
      - name: heating
        type: boolean
      - name: automatic_door
        type: boolean
      - name: nest_boxes
        type: integer
      - name: roost_length_m
        type: integer
      - name: ventilation_rating
        type: choice
        choices: ["poor", "adequate", "good", "excellent"]
    seed_data: true
  - name: Customer
    type: primary
    table: x_1939459_cluck_customer
    fields:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: phone
        type: string
      - name: street
        type: string
      - name: city
        type: string
      - name: state
        type: string
      - name: postal_code
        type: string
      - name: tier
        type: choice
        required: true
        choices: ["regular", "csa", "sponsor", "wholesale", "vip"]
    seed_data: true
  - name: Egg Log
    type: primary
    table: x_1939459_cluck_egg_log
    fields:
      - name: log_date
        type: date
        required: true
      - name: flock
        type: reference
        required: true
      - name: coop
        type: reference
      - name: count_collected
        type: integer
        required: true
      - name: count_jumbo
        type: integer
      - name: count_xlarge
        type: integer
      - name: count_large
        type: integer
      - name: count_medium
        type: integer
      - name: count_small
        type: integer
      - name: count_cracked
        type: integer
      - name: count_soft_shell
        type: integer
      - name: count_double_yolk
        type: integer
      - name: time_of_day
        type: choice
        choices: ["morning", "afternoon", "evening"]
      - name: avg_weight_g
        type: decimal
      - name: collector
        type: reference
    relationships:
      - target_table: x_1939459_cluck_flock
        type: belongs_to
        via_field: flock
      - target_table: x_1939459_cluck_coop
        type: belongs_to
        via_field: coop
  - name: Feed
    type: primary
    table: x_1939459_cluck_feed
    fields:
      - name: name
        type: string
        required: true
      - name: sku
        type: string
      - name: feed_type
        type: choice
        required: true
        choices: ["starter", "grower", "layer", "broiler", "scratch", "treat", "supplement"]
      - name: supplier
        type: string
      - name: bag_size_kg
        type: decimal
      - name: cost_per_bag
        type: decimal
      - name: protein_pct
        type: decimal
      - name: organic
        type: boolean
      - name: non_gmo
        type: boolean
      - name: on_hand_bags
        type: integer
        required: true
      - name: reorder_threshold
        type: integer
      - name: reorder_quantity
        type: integer
    seed_data: true
  - name: Flock
    type: primary
    table: x_1939459_cluck_flock
    fields:
      - name: name
        type: string
        required: true
      - name: coop
        type: reference
        required: true
      - name: purpose
        type: choice
        choices: ["laying", "breeding", "meat", "brooder", "mixed"]
      - name: current_count
        type: integer
      - name: established_date
        type: date
      - name: pasture_rotation_days
        type: integer
      - name: feed_schedule
        type: choice
        choices: ["once_daily", "twice_daily", "free_feed", "pasture_only"]
      - name: status
        type: choice
        required: true
        choices: ["active", "quarantine", "molting", "retired", "harvested"]
    seed_data: true
  - name: Health Record
    type: history
    table: x_1939459_cluck_health_record
    fields:
      - name: bird
        type: reference
      - name: flock
        type: reference
      - name: event_type
        type: choice
        required: true
        choices: ["wellness", "vaccination", "illness", "injury", "parasite", "broken_egg", "molt", "death"]
      - name: diagnosis
        type: string
      - name: symptoms
        type: string
      - name: treatment
        type: string
    relationships:
      - target_table: x_1939459_cluck_bird
        type: belongs_to
        via_field: bird
      - target_table: x_1939459_cluck_flock
        type: belongs_to
        via_field: flock
  - name: Incident
    type: history
    table: x_1939459_cluck_incident
    fields:
      - name: incident_type
        type: choice
        required: true
        choices: ["predator", "escape", "disease", "fencing", "theft", "quality", "delivery", "other"]
      - name: severity
        type: choice
        required: true
        choices: ["minor", "moderate", "major", "critical"]
      - name: occurred_at
        type: datetime
      - name: affected_flock
        type: reference
      - name: affected_coop
        type: reference
      - name: predator_species
        type: choice
        choices: ["hawk", "owl", "fox", "coyote", "raccoon", "weasel", "snake", "dog", "rat", "unknown"]
      - name: birds_lost
        type: integer
      - name: birds_injured
        type: integer
      - name: eggs_lost
        type: integer
      - name: estimated_cost
        type: integer
      - name: evidence_notes
        type: string
    relationships:
      - target_table: x_1939459_cluck_flock
        type: belongs_to
        via_field: affected_flock
      - target_table: x_1939459_cluck_coop
        type: belongs_to
        via_field: affected_coop
  - name: Incubation Batch
    type: primary
    table: x_1939459_cluck_incubation
    fields:
      - name: batch_name
        type: string
        required: true
      - name: incubator_id
        type: string
      - name: parent_flock
        type: reference
      - name: breed
        type: reference
      - name: start_date
        type: date
        required: true
      - name: expected_hatch_date
        type: date
      - name: actual_hatch_date
        type: date
      - name: eggs_set
        type: integer
        required: true
      - name: eggs_viable_day_7
        type: integer
      - name: eggs_viable_day_14
        type: integer
      - name: eggs_pipped
        type: integer
      - name: chicks_hatched
        type: integer
      - name: chicks_alive_day_3
        type: integer
      - name: target_temp_f
        type: decimal
      - name: target_humidity_pct
        type: decimal
      - name: hatch_rate_pct
        type: decimal
      - name: status
        type: choice
        required: true
        choices: ["incubating", "lockdown", "hatching", "complete", "failed"]
    relationships:
      - target_table: x_1939459_cluck_flock
        type: belongs_to
        via_field: parent_flock
      - target_table: x_1939459_cluck_breed
        type: belongs_to
        via_field: breed
  - name: Order
    type: history
    table: x_1939459_cluck_order
    fields:
      - name: customer
        type: reference
      - name: customer_name
        type: string
        required: true
      - name: order_type
        type: choice
        required: true
        choices: ["eggs", "csa", "chicks", "tour", "adoption", "other"]
      - name: egg_grade
        type: choice
        choices: ["jumbo", "xlarge", "large", "medium", "mixed"]
      - name: egg_dozens
        type: integer
      - name: chick_breed
        type: reference
      - name: chick_quantity
        type: integer

catalog:
  items:
    - name: Adopt-a-Hen (Annual Sponsorship)
      description: 'Become a hen''s official sponsor for a year.'
      variables:
        - name: hen
          label: Choose Your Hen
          type: reference
          required: true
          order: 500
        - name: gift_sponsorship
          label: Is this a gift?
          type: select
          required: false
          order: 600
          choices: ["True", "False"]
        - name: recipient_name
          label: Gift recipient name (optional)
          type: text
          required: false
          order: 700
        - name: certificate_message
          label: Message for the certificate (optional)
          type: text
          required: false
          order: 800
        - name: ship_certificate
          label: Ship a printed photo certificate?
          type: select
          required: false
          order: 900
          choices: ["True", "False"]
        - name: newsletter_opt_in
          label: Opt in to monthly hen updates?
          type: select
          required: false
          order: 1000
          choices: ["True", "False"]
    - name: Buy Fresh Eggs
      description: 'Our hens roam, forage, and eat organic layer feed. Pick your grade and how many dozens; delivery is $5 within 10 miles of the farm.'
      variables:
        - name: egg_grade
          label: Egg Grade
          type: select
          required: true
          order: 600
          choices: ["jumbo", "xlarge", "large", "medium", "mixed"]
        - name: egg_dozens
          label: How many dozens?
          type: text
          required: true
          order: 700
        - name: delivery_type
          label: Pickup or Delivery
          type: select
          required: true
          order: 800
          choices: ["pickup", "farm_stand", "local_delivery", "farmers_market"]
        - name: delivery_date
          label: Pickup / Delivery Date
          type: date
          required: true
          order: 1000
        - name: special_requests
          label: Special requests (double-yolk preference, coop-tour add-on...)
          type: text
          required: false
          order: 1100
    - name: Chick Pre-order
      description: 'Heritage and rare-egg breeds go fast. Reserve now and we''ll notify you on hatch day. Minimum 3 chicks per order (they need buddies to stay warm).'
      variables:
        - name: breed
          label: Breed
          type: reference
          required: true
          order: 500
        - name: quantity
          label: Quantity (minimum 3)
          type: text
          required: true
          order: 600
        - name: sex_preference
          label: Sex Preference
          type: select
          required: true
          order: 700
          choices: ["pullet", "straight", "cockerel"]
        - name: target_month
          label: Target Hatch Month
          type: select
          required: true
          order: 800
          choices: ["march", "april", "may", "june", "july", "august", "september", "flexible"]

workflows:
  - name: Egg Collection Analysis
    trigger: Daily logs updated
    conditions: Daily logs must be updated by noon
    actions: Report today's egg yield by 3PM

business_logic:
  rules:
    - name: Cluck - Calculate bird age from hatch date
      table: x_1939459_cluck_bird
      trigger: before insert
      logic_summary: Calculates age in days from the hatched date and updates the sex to hen or rooster if older than 20 weeks.
      external_dependencies: none
    - name: Cluck - Adjust flock head count when bird status changes
      table: x_1939459_cluck_bird
      trigger: after update
      logic_summary: Decreases flock head count if bird status changes to deceased, processed, escaped, or retired.
      external_dependencies: none
    - name: Cluck - Compute egg production rate
      table: x_1939459_cluck_egg_log
      trigger: before insert
      logic_summary: Calculates and stores the egg production rate based on the flock size and collected eggs.
      external_dependencies: none
    - name: Cluck - Auto-open feed reorder task
      table: x_1939459_cluck_feed
      trigger: after update
      logic_summary: Creates a reorder incident if feed stock drops below reorder threshold.
      external_dependencies: none
    - name: Cluck - Calculate order total
      table: x_1939459_cluck_order
      trigger: before insert
      logic_summary: Computes order subtotal and total cost based on items ordered.
      external_dependencies: none
    - name: Cluck - Award loyalty eggs on fulfillment
      table: x_1939459_cluck_order
      trigger: after update
      logic_summary: Awards loyalty points based on the total order value after fulfillment.
      external_dependencies: none
    - name: Cluck - Escalate critical incidents
      table: x_1939459_cluck_incident
      trigger: before insert
      logic_summary: Adjusts priority and urgency if incident is marked as critical.
      external_dependencies: none

ui:
  modules:
    - name: All Flocks
      table: x_1939459_cluck_flock
      type: LIST
      filter: none
    - name: Breed Catalog
      table: x_1939459_cluck_breed
      type: LIST
      filter: none
    - name: Today's Egg Log
      table: x_1939459_cluck_egg_log
      type: LIST
      filter: log_dateONToday@javascript:gs.beginningOfToday()@javascript:gs.endOfToday()

navigation:
  menu:
    - name: Cluckworks
      modules: ['All Flocks', 'Breed Catalog', "Today's Egg Log"]

data_model:
  tables:
    - name: x_1939459_cluck_bird
      purpose: To manage individual bird information for farm birds.
      key_fields:
        - name: tag_id
          type: string
          notes: Identifies leg-banded or wing-banded birds.
    - name: x_1939459_cluck_breed
      purpose: A reference catalog of chicken breeds being raised.
      key_fields:
        - name: name
          type: string
          notes: Identifies chicken breed by name.
    - name: x_1939459_cluck_coop
      purpose: To manage and monitor chicken coops and capacity.
      key_fields:
        - name: name
          type: string
          notes: Unique name identifying the coop.
    - name: x_1939459_cluck_customer
      purpose: Tracks customer details including sponsorship and order history.
      key_fields:
        - name: email
          type: string
          notes: Unique identifier for customers based on email.
    - name: x_1939459_cluck_egg_log
      purpose: Records daily egg collection details and production metrics.
      key_fields:
        - name: log_date
          type: date
          notes: Date of recorded egg collection.
    - name: x_1939459_cluck_feed
      purpose: Manages feed inventory and reordering thresholds.
      key_fields:
        - name: name
          type: string
          notes: Identifies feed by its common name.
    - name: x_1939459_cluck_flock
      purpose: To manage bird groupings, roll-up egg counts, and overall flock management.
      key_fields:
        - name: name
          type: string
          notes: Identifies flock by name.

integrations:
  - name: Cluck Egg Availability API
    type: REST
    direction: outbound
    description: Exposes current egg stock data for integration with external sites and dashboards.

logic_patterns:
  - name: decrease_flock_on_status_change
    description: Reduces the flock count when a bird's status is updated to deceased, processed, escaped, or retired.
    trigger: bird_status_update
    action: update flock head count
    reusable_pattern: status_based_flock_reduction
  - name: auto_feed_reorder_trigger
    description: Initiates a reorder when feed inventory falls below a predefined threshold.
    trigger: feed_inventory_update
    action: create reorder incident
    reusable_pattern: low_inventory_reorder_trigger

processes:
  - name: Egg Collection Process
    steps:
      - step: Record egg collection
        actor: Farmhand
        action: Log the number of eggs collected from each flock
        system_behavior: Update egg log record
      - step: Verify egg counts
        actor: Farmer
        action: Validate the recorded egg counts
        system_behavior: Confirm egg log accuracy
      - step: Report production rate
        actor: System
        action: Calculate and report daily production rates
        system_behavior: Generate production report

events:
  - name: Order Creation
    trigger: New order record created
    downstream_effects: Set default values for order_type, fulfillment_status, and delivery_type
  - name: Critical Incident Escalation
    trigger: Incident marked as critical
    downstream_effects: Increase priority and urgency, notify appropriate staff